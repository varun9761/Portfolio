<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Liquid Glass Gradient (Electric Blue -> Indigo -> Royal Violet) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Top Specular Sheen -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Inner Glass Rim -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#93c5fd" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.5" />
    </linearGradient>

    <!-- Text Fill Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#edf4ff" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#070c18" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="496" height="496" rx="138" fill="url(#bgGrad)" />

  <!-- Liquid Glass Top Sheen -->
  <path d="M 8 146 Q 8 8 146 8 L 366 8 Q 504 8 504 146 L 504 236 Q 256 286 8 236 Z" fill="url(#sheenGrad)" />

  <!-- Inner Rim Stroke -->
  <rect x="16" y="16" width="480" height="480" rx="130" fill="none" stroke="url(#rimGrad)" stroke-width="8" opacity="0.85" />

  <!-- Monogram VK -->
  <text 
    x="256" 
    y="256" 
    text-anchor="middle" 
    dominant-baseline="central" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'Arial', sans-serif" 
    font-size="270" 
    font-weight="900" 
    letter-spacing="-6" 
    fill="url(#textGrad)" 
    filter="url(#dropShadow)"
  >VK</text>
</svg>
